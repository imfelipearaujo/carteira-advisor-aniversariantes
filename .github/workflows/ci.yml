# Qualidade e segurança a cada push e pull request.
# Não usa token, não acessa a API de produção e não publica artefatos:
# os testes usam somente dados fictícios e sessões HTTP simuladas.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Garantia explícita de que nenhum teste recebe credencial.
  CARTEIRA_ADVISOR_TOKEN: ""

jobs:
  tests:
    name: Ruff e pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: python -m ruff check .
      - name: Ruff (formatação)
        run: python -m ruff format --check .
      - name: pytest
        run: python -m pytest -p no:cacheprovider

  secrets:
    name: Verificação de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar detect-secrets
        run: python -m pip install "detect-secrets==1.5.0"
      - name: detect-secrets (arquivos versionados × baseline)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
